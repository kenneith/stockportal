<body>
<div class="container">
  <div class="topbar">

  </div>

  <div class="page--login"><div id="loginCard" class="card login-card"><h2 style="margin-top:0">歡迎使用 盈利知-AI股市分析平台</h2><div class="login-sub">請輸入您的序號以登入。</div>

<input id="serialInput" placeholder="例如：LV1-XXXX-1234"/>

  <div id="appCard" class="card" style="display:none;">

        <div class="list" id="stockList"></div>

<div id="descBox" class="desc-card narrow" style="display:none;"><p id="descText" class="desc-text"></p></div>

            </table>

            <table id="techTable" class="compact-table">
              <thead><tr><th>指標</th><th>數值</th><th>判斷</th></tr></thead>

<script>
// ==== App State ====
let categories = [];
let currentCat = '';
let currentTicker = '';

// ==== Helpers ====
function setHeaderFrom(meta, lastClose, lastDate, summaryText){
  try{
    var t = document.getElementById('stock-title');
    var tags = document.getElementById('stock-tags');
    var latest = document.getElementById('stock-latest');
    if(!t || !tags || !latest) return;

    var code = (meta && meta.ticker) ? meta.ticker : '';
    var name = (meta && meta.name) ? meta.name : '';
    t.textContent = (code && name) ? (code + ' ' + name) : (code || name || '');

    tags.innerHTML = '';
    var mk = meta && meta.market ? meta.market : '';
    var ind = meta && meta.industry ? meta.industry : '';
    if(mk){
            var e1 = document.createElement('span');
      e1.className = 'tag tag-market';
      if (/上市/.test(mk)) { e1.classList.add('twse'); }
     else if (/上櫃/.test(mk)) { e1.classList.add('otc'); }
     e1.textContent = mk;
     tags.appendChild(e1);
    }
    if(ind){
      var e2 = document.createElement('span'); e2.className='tag tag-industry'; e2.textContent = ind; tags.appendChild(e2);
    }

    var lp = (lastClose!=null) ? lastClose : (meta && meta.latest_price != null ? meta.latest_price : null);
    var ld = lastDate || (meta && meta.latest_date ? meta.latest_date : '');
    var sum = summaryText || (meta && meta.summary ? meta.summary : '');
    var cls = (sum.indexOf('多')!==-1) ? 'tag-positive' : ((sum.indexOf('空')!==-1)?'tag-negative':'tag-neutral');
    latest.innerHTML = (lp!=null && ld)
      ? ('最新價：<b>' + lp + '</b>（' + ld + '） | 綜合判斷：<span class="tag ' + cls + '">' + (sum||'') + '</span>')
      : '';
  }catch(e){ console.warn(e); }
}

// ==== Login ====
async function login(){
  const codeInput = document.getElementById('serialInput'); // 登入序號輸入框
  const serial = (codeInput?.value || '').trim();

  try{
    // 呼叫後端登入，取得等級
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ serial })
    });
    if(!r.ok){
      alert('登入失敗，請確認序號。');
      return;
    }
    const u = await r.json(); // 例如 { code: 'LV2-XXXX-1234', level: 2 }

    // 顯示「已登入 Lv.X」
    const userInfo = document.getElementById('userInfo');
    if (userInfo) userInfo.textContent = `已登入  Lv.${u.level}`;

    // 關掉登入畫面、打開主畫面
    const lc = document.getElementById('loginCard'); if (lc) lc.style.display = 'none';
    const app = document.getElementById('appCard');  if (app) app.style.display = 'block';
    const lw = document.querySelector('.page--login'); if (lw) lw.style.display = 'none';

    // 若之後前台其他功能想用等級，可暫存起來
    window.__userLevel = u.level;

    // 載入分類/資料
    await loadCategories();

  }catch(err){
    console.error(err);
    alert('登入過程發生錯誤。');
  }
}

// ==== Load categories & tabs ====
async function loadCategories(){
  const r = await fetch('/api/categories');
  const data = await r.json();
  categories = data.categories || [];
  const tabs = document.getElementById('catTabs');
  if(!tabs) return;
  tabs.innerHTML = '';
  categories.forEach(function(c, idx){
    var el = document.createElement('div');
    el.className = 'tab' + (idx===0 ? ' active' : '');
    el.textContent = c.name + ' (' + (c.stocks?c.stocks.length:0) + ')';
    el.onclick = function(){ selectCategory(c.name, el); };
    tabs.appendChild(el);
  });
  if(categories.length>0){
    selectCategory(categories[0].name, tabs.children[0]);
  }
}

// ==== Left list ====
function renderStockList(stocks){
  const list = document.getElementById('stockList');
  if(!list) return;
  list.innerHTML = '';
  (stocks||[]).forEach(function(s){
    var liMarket   = s.market || s.market_type || s['市場別'] || s.listing || '';
    var liIndustry = s.industry || s['產業名稱'] || s.industry_name || s.sector || '';
    var div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = ''
      + '<div class="li-left"><b>' + s.ticker + '</b> ' + s.name + '</div>'
      + '<div class="li-tags">'
      + '</div>';
    div.onclick = function(){ selectTicker(s.ticker, s.name); };
    list.appendChild(div);
  });
}

// ==== Category switch ====
function selectCategory(name, el){
  var tabs = document.getElementById('catTabs');
  if(tabs){
    for(var i=0;i<tabs.children.length;i++){ tabs.children[i].classList.remove('active'); }
    if(el){ el.classList.add('active'); }
  }
  currentCat = name;
  var cat = null;
  for(var i=0;i<categories.length;i++){ if(categories[i].name===name){ cat = categories[i]; break; } }
  if(!cat){ cat = {stocks:[]}; }
  renderStockList(cat.stocks);
  if(cat.stocks && cat.stocks.length>0){
    selectTicker(cat.stocks[0].ticker, cat.stocks[0].name);
  }
}

// ==== Detail ====
async function selectTicker(ticker, name){
  var cat = null;
  for(var i=0;i<categories.length;i++){ if(categories[i].name===currentCat){ cat = categories[i]; break; } }
  var meta0 = null;
  if(cat && cat.stocks){ for(var j=0;j<cat.stocks.length;j++){ if(cat.stocks[j].ticker===ticker){ meta0 = cat.stocks[j]; break; } } }
  var meta = {
    ticker: ticker,
    name: name,
    market: (meta0 && (meta0.market || meta0.market_type || meta0['市場別'] || meta0.listing)) || '',
    industry: (meta0 && (meta0.industry || meta0['產業名稱'] || meta0.industry_name || meta0.sector)) || ''
  };

  currentTicker = ticker;

  // Chart
  const r = await fetch('/api/series/' + ticker + '?days=60');
  const data = await r.json();
  const dates = data.map(function(d){return d.date;});
  const o = data.map(function(d){return d.open;}),
        h = data.map(function(d){return d.max;}),
        l = data.map(function(d){return d.min;}),
        c = data.map(function(d){return d.close;});
  const v = data.map(function(d){return d.volume_lots;});

  const k = { x: dates, open: o, high: h, low: l, close: c, type: 'candlestick', name: 'K', increasing: { line: { color: '#ff4d4f' }, fillcolor: '#ff4d4f' }, decreasing: { line: { color: '#52c41a' }, fillcolor: '#52c41a' } };
  const line = { x: dates, y: c, type: 'scatter', name: '收盤價' };
  const vol = { x: dates, y: v, type: 'bar', name: '成交量(張)', xaxis: 'x2', yaxis: 'y2', marker: { color: '#7aa2f7' }, opacity: 0.6 };

  const layout = {
  font: { color: '#e6eef7' },
  paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
  margin: { l: 40, r: 40, t: 10, b: 20 },
  hovermode: 'x unified',
  hoverdistance: 50,
  spikedistance: -1,
  hoverlabel: { bgcolor: 'rgba(31,41,55,0.95)', bordercolor: '#374151', font: { color: '#e6eef7', size: 12 } },
  // 上方主圖（價格/K）
  xaxis:  { domain: [0, 1], rangeslider: { visible: false }, showspikes: true, spikemode: 'across', spikesnap: 'cursor', spikethickness: 1, spikecolor: '#9CA3AF' },
  yaxis:  { domain: [0.32, 1], title: { text: '價格', standoff: 10 }, automargin: true },
  // 下方副圖（成交量）
  xaxis2: { domain: [0, 1], matches: 'x', showticklabels: false, showspikes: true, spikemode: 'across', spikesnap: 'cursor', spikethickness: 1, spikecolor: '#9CA3AF' },
  yaxis2: { domain: [0, 0.25], title: { text: '量', standoff: 10 }, automargin: true, showgrid: false },
  bargap: 0.1
};
  var chartDiv = document.getElementById('chart');
  // Mobile legend & margins
try {
  var _m = window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
  if (_m) {
    if (!layout) { layout = {}; }
    layout.legend = { orientation: 'h', x: 0, y: 1.12, yanchor: 'bottom', xanchor: 'left' };
    layout.margin = { l: 36, r: 12, t: 56, b: 28 };
    if (layout.yaxis && layout.yaxis2) {
      layout.yaxis.domain = [0.28, 1];
      layout.yaxis2.domain = [0, 0.22];
    }
  }
} catch(e) {}

// === Plotly mobile legend override v9 ===
(function(){
  try {
    var isSmall = false;
    try {
      var rect = chartDiv && chartDiv.getBoundingClientRect ? chartDiv.getBoundingClientRect() : { width: 0 };
      isSmall = (rect.width && rect.width <= 480);
    } catch(e){}
    var mq = false;
    try { mq = window.matchMedia && window.matchMedia('(max-width: 640px)').matches; } catch(e){}
    if (isSmall || mq) {
      if (!layout) { layout = {}; }
      layout.legend = {
        orientation: 'h',
        xref: 'paper', yref: 'paper',
        x: 0, xanchor: 'left',
        y: 1.02, yanchor: 'bottom',
        bgcolor: 'rgba(0,0,0,0)'
      };
      var m = Object.assign({ l: 36, r: 12, t: 84, b: 28 }, layout.margin||{});
      layout.margin = m;
      if (layout.yaxis && layout.yaxis2) {
        layout.yaxis.domain = [0.30, 1];
        layout.yaxis2.domain = [0, 0.24];
      }
    }
  } catch(e) {}
})(); 
// === End v9 ===


// === Plotly desktop legend padding v10 ===
(function(){
  try {
    var rect = chartDiv && chartDiv.getBoundingClientRect ? chartDiv.getBoundingClientRect() : { width: 0 };
    var mqSmall = false;
    try { mqSmall = window.matchMedia && window.matchMedia('(max-width: 640px)').matches; } catch(e){}
    var isMobile = (mqSmall || (rect.width && rect.width <= 480));
    if (!isMobile) {
      if (!layout) { layout = {}; }
      // 放到繪圖區外的右側，給更多右邊空間，避免「成交量(張)」被切
      layout.legend = Object.assign({},
        layout.legend || {},
        { xref: 'paper', yref: 'paper', x: 1.02, xanchor: 'left', y: 1, yanchor: 'top' }
      );
      var m = Object.assign({ l: 40, r: 96, t: 10, b: 20 }, layout.margin||{});
      layout.margin = m;
    }
  } catch(e) {}
})();
// === End v10 ===

// === Plotly legend top for all viewports (v11) ===
(function(){
  try {
    if (!layout) { layout = {}; }
    // detect mobile width
    var rect = chartDiv && chartDiv.getBoundingClientRect ? chartDiv.getBoundingClientRect() : { width: 0 };
    var mqSmall = false;
    try { mqSmall = window.matchMedia && window.matchMedia('(max-width: 640px)').matches; } catch(e){}
    var isMobile = (mqSmall || (rect.width && rect.width <= 480));

    // legend on top (outside), horizontal
    layout.legend = Object.assign({}, layout.legend||{}, {
      orientation: 'h',
      xref: 'paper', yref: 'paper',
      x: 0, xanchor: 'left',
      y: 1.02, yanchor: 'bottom',
      bgcolor: 'rgba(0,0,0,0)'
    });

    // margins: give some headroom for legend
    if (isMobile) {
      layout.margin = Object.assign({ l: 36, r: 12, t: 84, b: 28 }, layout.margin||{});
      if (layout.yaxis && layout.yaxis2) {
        layout.yaxis.domain = [0.30, 1];
        layout.yaxis2.domain = [0, 0.24];
      }
    } else {
      // desktop
      layout.margin = Object.assign({ l: 40, r: 40, t: 64, b: 28 }, layout.margin||{});
      // keep original domains unless explicitly set
      if (layout.yaxis && layout.yaxis2) {
        if (!layout.yaxis.domain)  layout.yaxis.domain  = [0.32, 1];
        if (!layout.yaxis2.domain) layout.yaxis2.domain = [0, 0.25];
      }
    }
  } catch(e){}
})();
// === End v11 ===

// === Plotly legend top-right for all viewports (v11-final) ===
(function(){
  try {
    if (!layout) { layout = {}; }
    // Decide margins by viewport to ensure room for legend
    var rect = chartDiv && chartDiv.getBoundingClientRect ? chartDiv.getBoundingClientRect() : { width: 0 };
    var mqSmall=false; try{ mqSmall = window.matchMedia && window.matchMedia('(max-width: 640px)').matches; }catch(e){}
    var isMobile = (mqSmall || (rect.width && rect.width <= 480));

    // Put legend top-right (outside)
    layout.legend = Object.assign({}, layout.legend||{}, {
      orientation: 'h',
      xref: 'paper', yref: 'paper',
      x: 1, xanchor: 'right',
      y: 1.02, yanchor: 'bottom',
      bgcolor: 'rgba(0,0,0,0)'
    });

    // Top margin for legend + some breathing room; keep others reasonable
    var m = layout.margin || {};
    if (isMobile) {
      layout.margin = Object.assign({ l: 36, r: 12, t: 72, b: 28 }, m);
      if (layout.yaxis && layout.yaxis2) {
        layout.yaxis.domain = [0.30, 1];
        layout.yaxis2.domain = [0, 0.24];
      }
    } else {
      layout.margin = Object.assign({ l: 40, r: 40, t: 72, b: 28 }, m);
      // keep original domains for desktop unless already set
    }
  } catch(e) {}
})();
// === End v11-final ===

Plotly.purge(chartDiv);
Plotly.newPlot(chartDiv, [k, line, vol], layout, { displayModeBar: false, responsive: true });

  // Initialize shapes array for cross-panel vertical line
  Plotly.relayout(chartDiv, { shapes: [] });
  chartDiv.on('plotly_hover', function (ev) {
    const x = ev.points && ev.points.length ? ev.points[0].x : null;
    if (x == null) return;
    Plotly.relayout(chartDiv, {
      shapes: [{ type: 'line', x0: x, x1: x, y0: 0, y1: 1, xref: 'x', yref: 'paper', line: { color: '#9CA3AF', width: 1, dash: 'dot' } }]
    });
  });
  chartDiv.on('plotly_unhover', function () {
    Plotly.relayout(chartDiv, { shapes: [] });
  });

  // Indicators & header info
  const r2 = await fetch('/api/indicators/' + ticker);
  const info = await r2.json();
  // ===== 說明：顯示在圖表上方 =====
  const descBox = document.getElementById('descBox');
  const descText = document.getElementById('descText');
  const desc = (info && info.說明) ? String(info.說明).trim() : '';
  if (desc) {
    descBox.style.display = '';
    descText.textContent = desc;
  } else {
    descBox.style.display = 'none';
    if (descText) descText.textContent = '';
  }

  var summary = (info.summary || (info.meta && info.meta.summary)) || '';

  // meta fallback from info.meta
  if(info && info.meta){
    if(!meta.market && info.meta.market) meta.market = info.meta.market;
    if(!meta.industry && info.meta.industry) meta.industry = info.meta.industry;
  }

  // latest price/date
  var lp = null, ld = '';
  if(info && info.meta){
    if(info.meta.latest_price != null) lp = info.meta.latest_price;
    if(info.meta.latest_date) ld = info.meta.latest_date;
  }
  if(lp==null && data && data.length){ lp = data[data.length-1].close; }
  if(!ld && data && data.length){ ld = data[data.length-1].date; }

  setHeaderFrom(meta, lp, ld, summary);

  renderTable('fundTable', info.fundamentals || []);
  renderTable('techTable', info.technicals || []);
}

// ==== Table rendering ====
function renderTable(id, rows){
  var tb = document.querySelector('#'+id+' tbody');
  if(!tb) return;
  tb.innerHTML='';
  (rows||[]).forEach(function(r){
    var rule  = r['規則'] || '';
    var judge = (r['判斷']||'').toString();
    var cls   = /偏多/.test(judge) ? 'tag-positive' : (/偏空/.test(judge) ? 'tag-negative' : 'tag-neutral');

    var indicator = (r['指標']||'').toString();
    if (indicator === 'P_B') indicator = 'P/B';

    // 只處理布林通道/BBANDS：移除「收盤:...」
    var val = (r['數值'] || '').toString();

    if (indicator === '布林通道' || indicator === 'BBANDS') {
      // 1) 先把「收盤:xxx」整段刪掉（無論前面有沒有分號或換行）
      val = val.replace(/(?:;|\n)?\s*收盤:[^;<\n]+/g, '');

      // 2) 收尾清理：若最後留下的字串尾端剛好是分號就去掉
      val = val.replace(/;\s*$/, '');

      // 3) 若你要分號換行顯示
      val = val.replace(/;\s*/g, ';<br>');
    }

    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>'+indicator+'</td>'+
      '<td class="val-multiline">'+ val +'</td>'+
      '<td class="tooltip" data-tooltip="'+rule.replace(/"/g,'&quot;')+'"><span class="tag '+cls+'">'+(judge||'')+'</span></td>';
    tb.appendChild(tr);
  });
}
</script></script>

<script>
// === RWD + 空值處理 覆蓋版 renderTable（index.html）===
(function(){
  window.renderTable = function(id, rows){
    var tb = document.querySelector('#'+id+' tbody');
    if(!tb) return;
    tb.innerHTML='';
    (rows||[]).forEach(function(r){
      var rule  = r['規則'] || '';
      var judge = (r['判斷']||'').toString();
      var cls   = /偏多/.test(judge) ? 'tag-positive' : (/偏空/.test(judge) ? 'tag-negative' : 'tag-neutral');

      var indicator = (r['指標']||'').toString();
      if (indicator === 'P_B') indicator = 'P/B';

      var rawVal = r['數值'];
      var isInsufficient = /資料不足/i.test(judge);
      var hasVal = !isInsufficient && rawVal != null && String(rawVal).trim() !== '' && !/資料不足/i.test(String(rawVal));
      var val = hasVal ? String(rawVal) : '';

      if (hasVal && (indicator === '布林通道' || indicator === 'BBANDS')) {
        val = val.replace(/(?:;|\n)?\s*收盤:[^;<\n]+/g, '');
        val = val.replace(/;\s*$/, '');
        val = val.replace(/;\s*/g, ';<br>');
      }

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td data-label="指標">'+indicator+'</td>'+
        '<td data-label="數值" class="val-multiline">'+ val +'</td>'+
        '<td data-label="判斷" class="tooltip" data-tooltip="'+String(rule).replace(/"/g,'&quot;')+'"><span class="tag '+cls+'">'+(judge||'')+'</span></td>';
      tb.appendChild(tr);
    });
  }
})();
</script>


<script>
// === 自動將所有 <table> 外包 .table-responsive，並監聽動態新增 ===
(function () {
  function wrapTables(ctx=document) {
    ctx.querySelectorAll('table').forEach(function (tbl) {
      if (tbl.parentElement && tbl.parentElement.classList.contains('table-responsive')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-responsive';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
    });
  }
  wrapTables();
  const mo = new MutationObserver(muts => muts.forEach(m => m.addedNodes.forEach(n => {
    if (!(n instanceof HTMLElement)) return;
    if (n.tagName === 'TABLE') wrapTables(document); else wrapTables(n);
  })));
  mo.observe(document.body, { childList: true, subtree: true });
})();
</script>

<script>
// Apply compact mode to fundamental & technical tables if present
(function(){
  function applyCompact() {
    var ids = ['fundamental-table','technical-table','fund-table','tech-table'];
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.classList.add('compact-table');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyCompact);
  } else {
    applyCompact();
  }
})();
</script>


<script>
// v6: Any table that already uses data-labels becomes compact on phones
(function(){
  function markCompactTables(scope=document){
    scope.querySelectorAll('table').forEach(function(tbl){
      if (tbl.classList.contains('compact-table')) return;
      if (tbl.querySelector('td[data-label]')) {
        tbl.classList.add('compact-table');
      }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ markCompactTables(); });
  } else { markCompactTables(); }

  // Also watch for dynamic updates
  const mo = new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if (n.nodeType !== 1) return;
        if (n.tagName === 'TABLE') { markCompactTables(document); }
        else { markCompactTables(n); }
      });
    });
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();
</script>
