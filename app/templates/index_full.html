<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>盈利知-AI股市分析平台</title>
  <link rel="stylesheet" href="/static/styles.css"/>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="logo"><img src="/static/logo.svg" alt="盈利知" class="brand-logo"/><span class="brand-name">盈利知-AI股市分析平台</span></div>
    <div><span id="userInfo" class="badge">未登入</span></div>
  </div>

  <div class="page--login"><div id="loginCard" class="card login-card"><h2 style="margin-top:0">歡迎使用 盈利知-AI股市分析平台</h2><div class="login-sub">請輸入您的序號以登入。</div>
    <div class="grid-2">
      <div>
        <label>輸入序號登入</label>
        <input id="serialInput" placeholder="例如：LV1-XXXX-1234"/>
      </div>
      <div style="align-self:end;">
        <button class="btn" onclick="login()">登入</button>
      </div>
    </div>
    <div style="margin-top:8px;color:#96a0aa">
  </div><div class="disclaimer">本平台所提供之資料僅供參考，不構成任何投資建議或保證。投資必有風險，請審慎評估，自行負責。</div>
</div>
  </div>

  <div id="appCard" class="card" style="display:none;">
    <div class="tabs" id="catTabs"></div>
    <div class="row">
      <div>
        <div class="badge" id="catInfo">分類：-</div>
        <div class="list" id="stockList"></div>
      </div>
      <div>
        <div id="chart" class="card" style="height:420px;"></div>
        <div class="kpis">
          <div>
            <h3>基本面</h3>
            <table id="fundTable">
              <thead><tr><th>指標</th><th>數值</th><th>判斷</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div>
            <h3>技術面</h3>
            <table id="techTable">
              <thead><tr><th>指標</th><th>數值</th><th>判斷</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let user = null;
let categories = [];
let currentCat = null;
let currentTicker = null;

async function login(){
  const code = document.getElementById('serialInput').value.trim();
  const r = await fetch('/api/auth/login',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({serial: code})
  });
  if(!r.ok){ alert('登入失敗'); return; }
  user = await r.json();
  document.getElementById('userInfo').innerText = `等級 Lv.${user.level}`;
  document.getElementById('loginCard').style.display='none';
  document.getElementById('appCard').style.display='block';
  await loadCategories();
}

async function loadCategories(){
  const r = await fetch('/api/categories');
  const data = await r.json();
  categories = data.categories;
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = '';
  categories.forEach((c, idx)=>{
    const el = document.createElement('div');
    el.className = 'tab'+(idx===0?' active':'');
    el.innerText = `${c.name} (${c.stocks.length})`;
    el.onclick = ()=>selectCategory(c.name, el);
    tabs.appendChild(el);
  });
  if(categories.length>0){
    selectCategory(categories[0].name, tabs.children[0]);
  }
}

function selectCategory(name, el){
  for(const t of document.getElementById('catTabs').children){ t.classList.remove('active'); }
  el.classList.add('active');
  currentCat = name;
  document.getElementById('catInfo').innerText = `分類：${name}`;
  const cat = categories.find(x=>x.name===name);
  const list = document.getElementById('stockList');
  list.innerHTML = '';
  cat.stocks.forEach(s=>{
    const div = document.createElement('div');
    div.className='list-item';
    div.innerHTML = `<b>${s.ticker}</b> ${s.name}`;
    div.onclick = ()=>selectTicker(s.ticker, s.name);
    list.appendChild(div);
  });
  if(cat.stocks.length>0){ selectTicker(cat.stocks[0].ticker, cat.stocks[0].name); }
}

async function selectTicker(ticker, name){
  currentTicker = ticker;
  // Chart
  const r = await fetch(`/api/series/${ticker}?days=60`);
  const data = await r.json();
  const dates = data.map(d=>d.date);
  const o = data.map(d=>d.open), h=data.map(d=>d.max), l=data.map(d=>d.min), c=data.map(d=>d.close);
  const v = data.map(d=>d.volume_lots);

  const k = {x:dates, open:o, high:h, low:l, close:c, type:'candlestick', name:'K'};
  const line = {x:dates, y:c, type:'scatter', name:'收盤價'};
  const vol = {x:dates, y:v, type:'bar', name:'成交量(張)', yaxis:'y2', opacity:0.5};

  const layout = {
    paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
    margin:{l:40,r:40,t:10,b:20},
    xaxis:{rangeslider:{visible:false}},
    yaxis:{title:'價格'},
    yaxis2:{overlaying:'y', side:'right', title:'張', showgrid:false}
  };
const chartDiv = document.getElementById('chart');
Plotly.purge(chartDiv);  // 清除舊圖
Plotly.newPlot(chartDiv, [k,line,vol], layout, {displayModeBar:false});

  // Indicators
  const r2 = await fetch(`/api/indicators/${ticker}`);
  const info = await r2.json();
  renderTable('fundTable', info.fundamentals);
  renderTable('techTable', info.technicals);
}

function renderTable(id, rows){
  const tb = document.querySelector(`#${id} tbody`);
  tb.innerHTML='';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const rule = r.規則 || '';
    tr.innerHTML = `<td>${r.指標}</td><td>${r.數值}</td><td title="${rule}" class="tooltip">${r.判斷||''}</td>`;
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
